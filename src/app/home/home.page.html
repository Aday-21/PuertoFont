<!-- Cabecera principal -->
<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>
      Lista de Productos
    </ion-title>

    <!-- El contenedor de botones debe ir fuera de ion-title -->
    <ion-buttons slot="end">
      <ion-button routerLink="/ajustes">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <!-- Presentación de PuertoFont -->
  <ion-grid>
    <ion-row class="ion-align-items-center">
      <ion-col class="perfil-columna">
        <img src="assets/icon/PuertoFont.png" alt="Avatar de usuario" class="logo-sombra"/>
        <p>Este es el texto descriptivo del perfil. Ahora tiene más espacio disponible.</p>
        <!-- Botón secundario aplicado como pide la tarea -->
        <ion-button color="secondary">Contactar</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Mensaje cuando no hay productos -->
  <div *ngIf="listaDeProductosFont.length === 0" class="mensaje-vacio">
    <p>Vuelve Pronto!!</p>
    <p>No hay productos disponibles.</p>
  </div>

  <!-- Lista de productos -->
  <ion-grid id="productos">
    <ion-row>
      <ion-col size="12" size-md="4" size-lg="3" *ngFor="let prod_font of listaDeProductosFont">
        <app-prod-font-item
          [prod_font]="prod_font"> 
        </app-prod-font-item>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
