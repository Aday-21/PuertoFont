
<!-- Cabecera principal -->
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Lista de Productos
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- Cabecera grande -->
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Lista de Productos</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Directiva *ngIf: este div solo existirá en el DOM si la condición es verdadera -->
  <div *ngIf="listaDeProductosFont.length === 0" class="mensaje-vacio">
    <p>Vuelve Pronto!!</p>
    <p>No hay productos disponibles.</p>
  </div>

  <!-- 
    Directiva *ngFor: este es el bucle. 
    - Por cada objeto 'tarea' que haya en el array 'listaDeTareas'...
    - ...Angular creará una instancia de nuestro componente <app-prod_font-item>.
  -->
  <app-prod-font-item
    *ngFor="let prod_font of listaDeProductosFont"
    [prod_font]="prod_font"> <!-- Property Binding: le pasamos el objeto 'tarea' actual al @Input del componente hijo -->
  </app-prod-font-item>
</ion-content>
