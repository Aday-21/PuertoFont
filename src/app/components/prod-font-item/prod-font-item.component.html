<ion-card>
  <ion-item>

    <ion-thumbnail slot="start">
      <img [src]="prod_font.imagen" 
      [alt]="prod_font.nombre"
      loading="lazy" 
      />
    </ion-thumbnail>

    <!-- <ion-checkbox 
      slot="start"
      [checked]="prod_font.cantidad > 0">
    </ion-checkbox>-->

    <ion-label [class.tachado]="prod_font.cantidad <= 0">
      {{ prod_font.nombre }}
    </ion-label>
    
    <ion-button (click)="mostrarDetalles()" slot="end">
      Ver
    </ion-button>
    
  </ion-item>
</ion-card>
